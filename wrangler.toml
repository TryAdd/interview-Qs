name = "interviewq"
main = "worker.js"
compatibility_date = "2026-03-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Create with: npx wrangler kv namespace create SUBMISSIONS
# Then: npx wrangler kv namespace create SUBMISSIONS --preview
# Paste the IDs below, then run: npm run deploy
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# Must match the password you use on /admin
[vars]
ADMIN_PASSWORD = "Gits2026"

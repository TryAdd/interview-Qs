name = "interviewq"
main = "worker.js"
compatibility_date = "2026-03-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# REQUIRED: replace the placeholders below with real KV namespace IDs.
# Dashboard: Cloudflare → Storage & Databases → KV → Create namespace "SUBMISSIONS" → copy ID
# Or CLI (in your own terminal after `npx wrangler login`):
#   npx wrangler kv namespace create SUBMISSIONS
#   npx wrangler kv namespace create SUBMISSIONS --preview
# You can use the same ID for both id and preview_id if you only created one namespace.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "6d5195a6d7844b989b752c4f33cec098"
preview_id = "6d5195a6d7844b989b752c4f33cec098"

# Must match the password you use on /admin
[vars]
ADMIN_PASSWORD = "Gits2026"
